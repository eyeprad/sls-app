    <title>SLS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f0e8;
        --surface: #fbfaf4;
        --surface-2: #e7e4da;
        --text: #171812;
        --dim: #67675f;
        --border: #d4d0c3;
        --accent: #a96d0f;
        --accent-soft: #ead8b7;
        --green: #3f7d49;
        --green-soft: #d5e5d5;
        --red: #b94b3c;
        --red-soft: #f0d6d0;
        --radius: 16px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0b0c0b;
          --surface: #151714;
          --surface-2: #20231d;
          --text: #f2f0e8;
          --dim: #aaa89f;
          --border: #30332b;
          --accent: #d99a2b;
          --accent-soft: #3a2c12;
          --green: #62a66a;
          --green-soft: #19321d;
          --red: #d96552;
          --red-soft: #3a1f1b;
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      button, input, textarea { font: inherit; }
      button { color: inherit; }
      button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button:disabled { opacity: .45; cursor: not-allowed; }

      .app-shell { min-height: 100%; background: var(--bg); }
      .app-shell main { width: 100%; max-width: 760px; margin: 0 auto; padding-bottom: calc(124px + env(safe-area-inset-bottom)); }
      .view { padding: 22px 18px 30px; }

      .today-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px 24px; }
      .today-header h1, .section-header h1 { margin: 1px 0 0; font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-size: 35px; line-height: 1; letter-spacing: -.035em; font-weight: 700; }
      .date-day, .section-header > p, .habit-label { margin: 0; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .14em; }
      .streak-cluster { display: flex; align-items: stretch; gap: 0; min-height: 50px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 7px; }
      .streak-cluster > span { display: flex; align-items: center; gap: 4px; padding: 0 9px; }
      .streak-cluster > span + span { border-left: 1px solid var(--border); }
      .streak-cluster svg { color: var(--accent); fill: var(--accent); stroke-width: 1.3; }
      .streak-cluster b { font-size: 17px; }
      .streak-cluster small { color: var(--dim); font-size: 10px; }

      .reset-banner { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; padding: 15px 16px; color: var(--text); background: var(--accent-soft); border-radius: 12px; }
      .reset-banner svg { flex: none; color: var(--accent); fill: var(--accent); }
      .reset-banner strong, .reset-banner span { display: block; }
      .reset-banner strong { font-size: 14px; }
      .reset-banner span { margin-top: 2px; color: var(--dim); font-size: 13px; line-height: 1.35; }

      .habit-block { position: relative; overflow: hidden; margin-bottom: 14px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 28px rgba(26, 25, 18, .05); }
      .habit-block.complete { border-color: color-mix(in srgb, var(--green) 50%, var(--border)); }
      .habit-block.complete::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--green); }
      .habit-top { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: start; }
      .habit-index { color: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding-top: 4px; }
      .habit-top h2 { margin: 5px 0 1px; font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-size: 25px; line-height: 1.05; letter-spacing: -.02em; }
      .habit-top p:not(.habit-label) { margin: 0; color: var(--dim); font-size: 13px; }
      .habit-note { margin: 17px 0 14px 42px; color: var(--dim); font-size: 13px; line-height: 1.45; }
      .completion-mark { display: grid; place-items: center; width: 31px; height: 31px; color: var(--surface); background: var(--green); border-radius: 50%; }
      .choices { display: grid; gap: 8px; margin-top: 16px; }
      .choices.two { grid-template-columns: 1fr 1fr; }
      .workout-choices { grid-template-columns: 1fr 1.25fr 1fr; }
      .choice { min-height: 48px; display: flex; justify-content: center; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); font-size: 13px; font-weight: 750; cursor: pointer; }
      .choice.active { border-color: var(--green); color: var(--green); background: var(--green-soft); }
      .exercise-toggle { width: calc(100% - 42px); margin: 16px 0 0 42px; display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 4px; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--dim); font-size: 13px; font-weight: 650; cursor: pointer; }
      .exercise-toggle span { transition: transform .2s ease; }
      .exercise-toggle span.rotate { transform: rotate(180deg); }
      .exercise-list { list-style: decimal-leading-zero; margin: 2px 0 16px 42px; padding: 3px 0 0 25px; color: var(--dim); font-size: 13px; }
      .exercise-list li { padding: 7px 0 7px 6px; border-bottom: 1px solid var(--border); }
      .class-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; padding: 10px; background: var(--surface-2); border-radius: 12px; }
      .class-picker button { min-height: 44px; padding: 6px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); font-size: 12px; font-weight: 700; cursor: pointer; }
      .rest-block { background: color-mix(in srgb, var(--surface) 65%, var(--bg)); border-style: dashed; }
      .rest-block .habit-label { color: var(--dim); }
      .yoga .habit-label { color: var(--green); }
      .practice-block { padding-bottom: 13px; }
      .practice-block .habit-top { grid-template-columns: 34px 1fr auto; align-items: center; }
      .practice-block .habit-top h2 { margin-top: 3px; }
      .practice-list { display: grid; gap: 7px; margin: 14px 0 0 42px; }
      .practice-row { display: grid; grid-template-columns: minmax(0, 1fr) 42px; gap: 7px; }
      .practice-check { min-height: 46px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; text-align: left; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); font-size: 13px; font-weight: 700; cursor: pointer; }
      .practice-check .check-box { display: grid; place-items: center; width: 21px; height: 21px; flex: none; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
      .practice-check.active { color: var(--green); border-color: var(--green); background: var(--green-soft); }
      .practice-check.active .check-box { color: var(--surface); border-color: var(--green); background: var(--green); }
      .practice-edit { display: grid; place-items: center; min-height: 42px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--dim); cursor: pointer; }
      .practice-editor { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 7px; }
      .practice-editor input { min-width: 0; min-height: 42px; padding: 0 11px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 9px; }
      .practice-editor button { min-height: 42px; padding: 0 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); font-size: 12px; font-weight: 750; cursor: pointer; }
      .practice-editor .save-label { border-color: var(--accent); background: var(--accent); color: #15120d; }

      .reflection-block { margin-top: 22px; padding: 0 2px; }
      .reflection-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
      .reflection-head label { font-weight: 750; font-size: 14px; }
      .reflection-head label span { color: var(--dim); font-size: 12px; font-weight: 500; }
      .reflection-head button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 9px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 750; cursor: pointer; flex: none; }
      .reflection-block textarea { width: 100%; min-height: 92px; resize: vertical; padding: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
      .reflection-block textarea::placeholder { color: var(--dim); }
      .reflection-footer { margin-top: 8px; }
      .reflection-footer span { color: var(--dim); font-size: 11px; }

      .section-header { padding: 14px 2px 24px; }
      .section-header > span { display: block; margin-top: 9px; color: var(--dim); font-size: 14px; }
      .week-picker { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin-bottom: 14px; }
      .week-picker button { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 50%; background: var(--surface); cursor: pointer; }
      .week-picker button:first-child svg { transform: rotate(180deg); }
      .week-picker div { text-align: center; }
      .week-picker strong, .week-picker span { display: block; }
      .week-picker strong { font-size: 14px; }
      .week-picker span { margin-top: 2px; color: var(--dim); font-size: 11px; }
      .rings-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 24px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
      .ring-wrap { text-align: center; }
      .ring-wrap > span { display: block; margin-top: 9px; font-size: 13px; font-weight: 700; }
      .ring { --progress: 0deg; display: grid; place-items: center; width: 112px; height: 112px; margin: auto; border-radius: 50%; background: conic-gradient(var(--accent) var(--progress), var(--surface-2) 0); }
      .ring::before { content: ""; grid-area: 1 / 1; width: 83px; height: 83px; border-radius: 50%; background: var(--surface); }
      .ring div { grid-area: 1 / 1; z-index: 1; }
      .ring strong { font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-size: 31px; }
      .ring span { color: var(--dim); font-size: 14px; }
      .miss-alert { display: flex; gap: 12px; margin-top: 12px; padding: 13px; background: var(--red-soft); border-radius: 12px; }
      .miss-alert > span { display: grid; place-items: center; width: 27px; height: 27px; flex: none; border-radius: 50%; background: var(--red); color: white; font-weight: 900; }
      .miss-alert strong { font-size: 13px; }
      .miss-alert p { margin: 2px 0 0; color: var(--dim); font-size: 12px; }
      .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 15px; padding: 14px 7px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
      .day-column { display: grid; justify-items: center; gap: 7px; padding: 7px 2px; border-radius: 10px; }
      .day-column.is-today { background: var(--surface-2); }
      .day-column > span { color: var(--dim); font-size: 10px; font-weight: 700; }
      .day-column > b { font-size: 13px; }
      .status-dot { display: block; width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
      .status-dot.spiritual.done { background: var(--accent); }
      .status-dot.workout.done { background: var(--green); }
      .status-dot.miss { background: var(--red); }
      .status-dot.future { background: var(--border); }
      .status-dot.off { opacity: .18; }
      .legend { display: flex; justify-content: center; gap: 18px; margin: 9px 0 18px; color: var(--dim); font-size: 11px; }
      .legend span { display: flex; align-items: center; gap: 6px; }
      .streak-ledger { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .streak-ledger > div { padding: 17px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
      .streak-ledger span { color: var(--dim); font-size: 11px; }
      .streak-ledger strong { display: block; margin-top: 9px; font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-size: 30px; }
      .streak-ledger small { color: var(--dim); font-family: inherit; font-size: 11px; font-weight: 500; }
      .streak-ledger p { margin: 4px 0 0; color: var(--dim); font-size: 11px; }
      .score-note { margin: 18px 4px 0; color: var(--dim); font-size: 12px; line-height: 1.5; }

      .area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .area-tile { position: relative; min-height: 164px; padding: 14px; text-align: left; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); cursor: pointer; }
      .area-tile.soon { background: color-mix(in srgb, var(--surface) 58%, var(--bg)); }
      .area-number { color: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
      .area-status { display: inline-flex; align-items: center; gap: 5px; float: right; color: var(--dim); font-size: 9px; font-weight: 700; }

    <div class="app-shell">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      "use strict";

      /* ------------------------------------------------------------------
         SLS — Single Life System companion (static rebuild).
         Supabase is the durable cross-device record. localStorage remains
         an offline cache, and Notion stays available as an optional sync.
      ------------------------------------------------------------------ */

      var STORE_KEY = "sls.state.v1";
      var SUPABASE_URL = "https://dflahjxwxqxsqwrjnhrc.supabase.co";
      var SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vk7SYGrhku7CVPQdJZU07w_PAJsdmV_";
      var MAGIC_LINK_REDIRECT = "https://eyeprad.github.io/sls-app/";
      var DEFAULT_DATABASE_ID = "dbe57da9-f63c-4777-ba59-b50a168da743";
      var NOTION_VERSION = "2022-06-28";
      var BACKUP_CLASSES = ["Circuit Training", "HIIT", "Cycle"];

      // Lift sessions by JS weekday (0 = Sun … 6 = Sat).
      var SESSIONS = {
        1: { name: "Push", exercises: ["Bench Press · 4 × 6–8", "Incline DB Press · 3 × 8–12", "Seated Overhead Press · 3 × 8–12", "Lateral Raise · 3 × 8–12"] },
        2: { name: "Pull", exercises: ["Bent Over Row · 3 × 8–12", "Lat Pulldown · 3 × 8–12", "Shrug · 4 × 8–12", "Face Pull · 3 × 8–12"] },
        3: { name: "Legs", exercises: ["Squat · 3 × 6–12", "Seated Hamstring Curl · 3 × 8–12", "Leg Extension · 3 × 8–12", "Standing Calf Raise · 3 × 15–20"] }
      };

      // The whole system of systems: five areas active now, six coming soon.
      var AREAS = [
        { key: "fitness", title: "Fitness", role: "Personal trainer", status: "active", targets: ["3 workouts each week", "Never miss two scheduled workouts in a row", "A lift, backup class, or minimum effort fills the slot"] },
        { key: "spiritual", title: "Spiritual", role: "Pastor, spiritual director, or mentor", status: "active", targets: ["Daily spiritual practice", "Morning prayer is the anchor", "Car worship and Bible reading at work complete it"] },
        { key: "financial", title: "Financial", role: "Fiduciary financial planner, CPA", status: "soon", targets: [] },
        { key: "nutrition", title: "Nutrition", role: "Registered dietitian", status: "active", targets: ["Hit your protein goal daily", "Stay hydrated", "Never miss two days in a row"] },
        { key: "health-recovery", title: "Health & Recovery", role: "Primary care doctor", status: "active", targets: ["Get 7+ hours of sleep", "Be in bed by 11 PM", "Protect a consistent recovery rhythm"] },
        { key: "mental-emotional", title: "Mental & Emotional", role: "Therapist or counselor", status: "soon", targets: [] },
        { key: "relationships", title: "Relationships", role: "Marriage or relationship coach, mentor", status: "soon", targets: [] },
        { key: "career-purpose", title: "Career & Purpose", role: "Career coach, executive mentor", status: "active", targets: ["Complete one deep work block daily", "Move your main goal forward every day", "Never miss two days in a row"] },
        { key: "learning-growth", title: "Learning & Growth", role: "Tutor, mastermind group", status: "soon", targets: [] },
        { key: "time-productivity", title: "Time & Productivity", role: "Executive assistant, chief of staff", status: "soon", targets: [] },
        { key: "home-admin", title: "Home & Admin", role: "House manager, assistant", status: "soon", targets: [] }
      ];

      var PRACTICE_AREAS = [
        { key: "nutrition", title: "Nutrition", practices: [{ id: "protein", label: "Hit protein goal" }, { id: "water", label: "Drank enough water" }] },
        { key: "career-purpose", title: "Career & Purpose", practices: [{ id: "deep_work", label: "Deep work block" }, { id: "goal_progress", label: "Moved my main goal forward" }] },
        { key: "health-recovery", title: "Health & Recovery", practices: [{ id: "sleep", label: "7+ hours of sleep" }, { id: "bedtime", label: "In bed by 11 PM" }] }
      ];

      function blankPractices() {
        return {
          nutrition: { protein: false, water: false },
          "career-purpose": { deep_work: false, goal_progress: false },
          "health-recovery": { sleep: false, bedtime: false }
        };
      }

      function normalizePractices(value) {
        var normalized = blankPractices();
        PRACTICE_AREAS.forEach(function (area) {
          var source = value && typeof value[area.key] === "object" ? value[area.key] : {};
          area.practices.forEach(function (practice) { normalized[area.key][practice.id] = Boolean(source[practice.id]); });
        });
        return normalized;
      }

      /* ---------------- date helpers ---------------- */

      function localIso(date) {
        date = date || new Date();
        var y = date.getFullYear();
        var m = String(date.getMonth() + 1).padStart(2, "0");
        var d = String(date.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + d;
      }

      function fromIso(value) {
        var parts = value.split("-").map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
      }

      function addDays(value, amount) {
        var date = fromIso(value);
        date.setDate(date.getDate() + amount);
        return localIso(date);
      }

      function mondayOf(value) {
        var date = fromIso(value);
        var day = date.getDay();
        date.setDate(date.getDate() - (day === 0 ? 6 : day - 1));
        return localIso(date);
      }

      function longDate(value) {
        var date = fromIso(value);
        return {
          weekday: new Intl.DateTimeFormat("en-US", { weekday: "long" }).format(date),
          date: new Intl.DateTimeFormat("en-US", { month: "long", day: "numeric" }).format(date)
        };
      }

      var WEEKDAY_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      /* ---------------- state store ---------------- */

      function blankLog(date) {
        return { date: date, spiritualStatus: "none", workoutStatus: "none", workoutDetail: "", yogaDone: false, practices: blankPractices(), reflection: "", syncStatus: "disabled", syncMessage: "", syncedAt: null };
      }

      function defaultState() {
        return {
          settings: { notionToken: "", notionDatabaseId: DEFAULT_DATABASE_ID, notionConnected: false, notionWorkspaceName: "", notionLastTestedAt: null, supabaseImportedUsers: {}, practiceLabels: {} },
          logs: {},
          accountLogs: {}
        };
      }

      var store = (function () {
        var data;
        var activeUserId = "";
        try {
          var raw = window.localStorage.getItem(STORE_KEY);
          data = raw ? JSON.parse(raw) : defaultState();
          if (!data || typeof data !== "object" || !data.settings || !data.logs) data = defaultState();
          if (!data.settings.supabaseImportedUsers || typeof data.settings.supabaseImportedUsers !== "object") data.settings.supabaseImportedUsers = {};
          if (!data.settings.practiceLabels || typeof data.settings.practiceLabels !== "object") data.settings.practiceLabels = {};
          if (!data.accountLogs || typeof data.accountLogs !== "object") data.accountLogs = {};
        } catch (e) {
          data = defaultState();
          data.accountLogs = {};
        }
        function currentLogs() {
          if (!activeUserId) return data.logs;
          if (!data.accountLogs[activeUserId]) data.accountLogs[activeUserId] = {};
          return data.accountLogs[activeUserId];
        }
        return {
          get settings() { return data.settings; },
          get logs() { return currentLogs(); },
          get legacyLogs() { return data.logs; },
          setActiveUser: function (userId) { activeUserId = userId || ""; persist(); },
          log: function (date) {
            var logs = currentLogs();
            var log = logs[date] ? Object.assign(blankLog(date), logs[date]) : blankLog(date);
            log.practices = normalizePractices(log.practices);
            return log;
          },
          saveLog: function (log) {
            currentLogs()[log.date] = log;
            persist();
          },
          saveSettings: function () { persist(); }
        };
        function persist() {
          try { window.localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { /* storage full/blocked — app still works in-memory */ }
        }
      })();

      /* ---------------- streak math ---------------- */

      function countSpiritualStreak(logs, today) {
        function completed(date) { var l = logs[date]; return l && l.spiritualStatus !== "none"; }
        var cursor = completed(today) ? today : addDays(today, -1);
        var current = 0;
        while (completed(cursor) && current < 370) { current += 1; cursor = addDays(cursor, -1); }
        var sorted = Object.keys(logs).filter(function (d) { return logs[d].spiritualStatus !== "none"; }).sort();
        var best = 0, run = 0, prior = "";
        sorted.forEach(function (date) {
          run = prior && addDays(prior, 1) === date ? run + 1 : 1;
          best = Math.max(best, run);
          prior = date;
        });
        return { current: current, best: best };
      }

      function workoutWeekStreak(logs, today) {
        var starts = {};
        Object.keys(logs).forEach(function (date) { starts[mondayOf(date)] = true; });
        starts[mondayOf(today)] = true;
        function weekOk(start) {
          return [0, 1, 2].every(function (i) { var l = logs[addDays(start, i)]; return l && l.workoutStatus !== "none"; });
        }
        var complete = Object.keys(starts).sort().map(function (start) { return { start: start, ok: weekOk(start) }; });
        var best = 0, run = 0;
        complete.forEach(function (week) { run = week.ok ? run + 1 : 0; best = Math.max(best, run); });
        var cursor = mondayOf(today);
        if (!weekOk(cursor)) cursor = addDays(cursor, -7);
        var current = 0;
        while (weekOk(cursor) && current < 520) { current += 1; cursor = addDays(cursor, -7); }
        return { current: current, best: best };
      }

      function practiceAreaDone(log, areaKey) {
        if (!log) return false;
        var normalized = normalizePractices(log.practices);
        var area = PRACTICE_AREAS.filter(function (item) { return item.key === areaKey; })[0];
        return Boolean(area && area.practices.every(function (practice) { return normalized[areaKey][practice.id]; }));
      }

      function practiceStreak(logs, todayValue, areaKey) {
        function completed(date) { return practiceAreaDone(logs[date], areaKey); }
        var cursor = completed(todayValue) ? todayValue : addDays(todayValue, -1);
        var current = 0;
        while (completed(cursor) && current < 370) { current += 1; cursor = addDays(cursor, -1); }
        var sorted = Object.keys(logs).filter(completed).sort();
        var best = 0, run = 0, prior = "";
        sorted.forEach(function (date) {
          run = prior && addDays(prior, 1) === date ? run + 1 : 1;
          best = Math.max(best, run);
          prior = date;
        });
        return { current: current, best: best };
      }

      /* ---------------- Notion sync ---------------- */

      function notionRequest(token, url, init) {
        var headers = { "Authorization": "Bearer " + token, "Notion-Version": NOTION_VERSION, "Content-Type": "application/json" };
        var options = Object.assign({}, init || {}, { headers: headers });
        return fetch(url, options).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) {
              var message = data && typeof data.message === "string" ? data.message : "Notion rejected the request.";
              throw new Error(message);
            }
            return data;
          });
        });
      }

      function sessionForDate(date) {
        var day = fromIso(date).getDay();
        return SESSIONS[day] ? SESSIONS[day].name : "Rest";
      }

      function dayTitle(date) {
        return new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric" }).format(fromIso(date));
      }

      function syncLogToNotion(log) {
        var settings = store.settings;
        if (!settings.notionConnected) return Promise.resolve({ status: "disabled", message: "" });
        var token = settings.notionToken;
        if (!token) return Promise.resolve({ status: "error", message: "Reconnect Notion in Settings." });

        var databaseId = settings.notionDatabaseId || DEFAULT_DATABASE_ID;
        var session = sessionForDate(log.date);
        var noteParts = [];
        if (log.workoutStatus === "lift") noteParts.push(log.workoutDetail || session);
        if (log.workoutStatus === "class") noteParts.push((log.workoutDetail || "Backup class") + " (backup)");
        if (log.workoutStatus === "minimum") noteParts.push(session + " — minimum");
        if (log.yogaDone && fromIso(log.date).getDay() === 2) noteParts.push("Vinyasa Yoga");
        var minimumOnly = log.spiritualStatus === "minimum" || log.workoutStatus === "minimum";

        var properties = {
          "Day": { title: [{ text: { content: dayTitle(log.date) } }] },
          "Date": { date: { start: log.date } },
          "Spiritual Practice": { checkbox: log.spiritualStatus !== "none" },
          "Workout Done": { checkbox: log.workoutStatus !== "none" },
          "Planned Workout": { select: { name: session === "Rest" ? "Rest" : "Strength" } },
          "Workout Notes": { rich_text: noteParts.length ? [{ text: { content: noteParts.join(" · ") } }] : [] },
          "Minimum Only": { checkbox: minimumOnly },
          "Gratitude & Reflection": { rich_text: log.reflection ? [{ text: { content: log.reflection.slice(0, 1900) } }] : [] }
        };

        return notionRequest(token, "https://api.notion.com/v1/databases/" + databaseId + "/query", {
          method: "POST",
          body: JSON.stringify({ filter: { property: "Date", date: { equals: log.date } }, page_size: 1 })
        }).then(function (query) {
          var results = Array.isArray(query.results) ? query.results : [];
          var existing = results[0];
          if (existing && typeof existing.id === "string") {
            return notionRequest(token, "https://api.notion.com/v1/pages/" + existing.id, {
              method: "PATCH",
              body: JSON.stringify({ properties: properties })
            });
          }
          return notionRequest(token, "https://api.notion.com/v1/pages", {
            method: "POST",
            body: JSON.stringify({ parent: { database_id: databaseId }, properties: properties })
          });
        }).then(function () {
          return { status: "synced", message: "Synced to Notion" };
        }).catch(function (error) {
          var message = error instanceof Error ? error.message : "Notion sync failed.";
          return { status: "error", message: message.slice(0, 180) };
        });
      }

      /* ---------------- Supabase accounts + durable sync ---------------- */

      function logHasHistory(log) {
        var practices = normalizePractices(log && log.practices);
        var practiceDone = PRACTICE_AREAS.some(function (area) {
          return area.practices.some(function (practice) { return practices[area.key][practice.id]; });
        });
        return Boolean(log && (log.spiritualStatus !== "none" || log.workoutStatus !== "none" || log.yogaDone || practiceDone || String(log.reflection || "").trim()));
      }

      function isMissingColumn(error, column) {
        var message = String(error && error.message || "").toLowerCase();
        var code = String(error && error.code || "");
        return (code === "PGRST204" || code === "42703" || message.indexOf("schema cache") !== -1 || message.indexOf("does not exist") !== -1) && message.indexOf(column.toLowerCase()) !== -1;
      }

      function logToSupabaseRow(log, profileId, includePractices) {
        var workoutDone = log.workoutStatus !== "none";
        var workoutType = log.workoutStatus === "lift" || log.workoutStatus === "class" ? log.workoutStatus : null;
        var workoutNotes = workoutDone ? (log.workoutDetail || (SESSIONS[fromIso(log.date).getDay()] || {}).name || null) : null;
        var row = {
          profile_id: profileId,
          log_date: log.date,
          day_label: dayTitle(log.date),
          spiritual_done: log.spiritualStatus !== "none",
          spiritual_minimum: log.spiritualStatus === "minimum",
          workout_done: workoutDone,
          workout_minimum: log.workoutStatus === "minimum",
          workout_type: workoutType,
          workout_notes: workoutNotes,
          yoga_done: Boolean(log.yogaDone),
          gratitude: log.reflection || "",
          updated_at: new Date().toISOString()
        };

        log.workoutDetail = row.workout_notes || "";

      function syncLogToSupabase(log) {
        if (!supabaseClient || !authState.session || !authState.session.user) return Promise.resolve({ status: "offline" });

        return supabaseClient.from("daily_logs").upsert(logToSupabaseRow(log, userId, true), { onConflict: "profile_id,log_date" }).then(function (result) {
          if (!result.error) return { status: "synced" };

          return { status: "error", message: error && error.message ? error.message : "Cloud sync failed." };

      function fetchAllDailyLogs(userId, offset, collected, includePractices) {

        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce" } });
        var code = new URLSearchParams(window.location.search).get("code");
        var exchange = code ? supabaseClient.auth.exchangeCodeForSession(code).then(function (result) {
          if (result.error) throw result.error;

            var clean = new URL(window.location.href);
            clean.searchParams.delete("code");
            window.history.replaceState({}, document.title, clean.pathname + clean.search + clean.hash);
          } catch (e) { /* keep the callback URL if the host blocks history changes */ }
        }) : Promise.resolve();
        exchange.then(function () { return supabaseClient.auth.getSession(); }).then(function (result) {
          if (result.error) throw result.error;
          var session = result.data && result.data.session;

        var yesterdayDay = fromIso(addDays(today, -1)).getDay();
        var yesterdayWorkoutMiss = Boolean(SESSIONS[yesterdayDay]) && (!yesterday || yesterday.workoutStatus === "none");
        var needsReset = (todayLog.spiritualStatus === "none" && yesterdaySpiritualMiss) || (Boolean(session) && todayLog.workoutStatus === "none" && yesterdayWorkoutMiss);

        var html = "";
        html += '<div class="view today-view">';
        html += '<header class="today-header"><div><p class="date-day">' + escapeHtml(parts.weekday.toUpperCase()) + '</p><h1>' + escapeHtml(parts.date) + "</h1></div>";
        html += '<button type="button" class="streak-cluster" id="streak-cluster" aria-label="Open streak scorecard"><span>' + icon("flame", 18) + "<b>" + spiritualStreak.current + "</b><small>days</small></span><span><b>" + workoutStreak.current + "</b><small>wks</small></span></button></header>";

        if (needsReset) {
          html += '<div class="reset-banner">' + icon("flame", 22) + "<div><strong>Never miss twice.</strong><span>Today resets it. Keep the promise small if you need to.</span></div></div>";
        }

        // Spiritual
        var spiritualDone = todayLog.spiritualStatus !== "none";
        html += '<section class="habit-block' + (spiritualDone ? " complete" : "") + '">';
        var isWeekend = weekdayNumber === 0 || weekdayNumber === 6;
        html += '<div class="habit-top"><span class="habit-index">01</span><div><p class="habit-label">SPIRITUAL · DAILY</p><h2>Morning prayer</h2><p>' + (isWeekend ? "First thing, before the day gets loud" : "6:45–7 AM anchor") + "</p></div>" + (spiritualDone ? '<span class="completion-mark">' + icon("check") + "</span>" : "") + "</div>";
        html += '<p class="habit-note">' + (isWeekend ? "Worship and Bible reading today complete it." : "Car worship + Bible at work complete it.") + "</p>";
        html += '<div class="choices two">';
        html += choiceButton(todayLog.spiritualStatus === "done", "Done", 'data-action="spiritual-done"');
        html += choiceButton(todayLog.spiritualStatus === "minimum", "Minimum", 'data-action="spiritual-minimum"');
        html += "</div></section>";

        // Workout / rest
        if (session) {
          var workoutDone = todayLog.workoutStatus !== "none";
          html += '<section class="habit-block workout' + (workoutDone ? " complete" : "") + '">';
          html += '<div class="habit-top"><span class="habit-index">02</span><div><p class="habit-label">FITNESS · 12–1 PM</p><h2>' + escapeHtml(session.name) + " day</h2><p>Gym at work</p></div>" + (workoutDone ? '<span class="completion-mark">' + icon("check") + "</span>" : "") + "</div>";
          html += '<button type="button" class="exercise-toggle" id="exercise-toggle" aria-expanded="' + ui.exercisesOpen + '">' + (ui.exercisesOpen ? "Hide exercises" : "View exercises") + '<span class="' + (ui.exercisesOpen ? "rotate" : "") + '">' + icon("chevron", 18) + "</span></button>";
          if (ui.exercisesOpen) {
            html += '<ol class="exercise-list">' + session.exercises.map(function (exercise) { return "<li>" + escapeHtml(exercise) + "</li>"; }).join("") + "</ol>";
          }
          html += '<div class="choices workout-choices">';
          html += choiceButton(todayLog.workoutStatus === "lift", "Lift done", 'data-action="workout-lift"');
          html += choiceButton(todayLog.workoutStatus === "class", "Class instead", 'data-action="workout-class-open"');
          html += choiceButton(todayLog.workoutStatus === "minimum", "Minimum", 'data-action="workout-minimum"');
          html += "</div>";
          if (ui.classPicker) {
            html += '<div class="class-picker" role="group" aria-label="Choose backup class">' + BACKUP_CLASSES.map(function (name) {
              return '<button type="button" data-class="' + escapeHtml(name) + '">' + escapeHtml(name) + "</button>";
            }).join("") + "</div>";
          }
          html += "</section>";
        } else {
          var restNote = weekdayNumber === 4
            ? "Recover well. Thursday Cycle at 5:30 PM is tonight's backup if an earlier slot was missed."
            : "Recover well. No backup class left this week — the next lift is Monday.";
          html += '<section class="habit-block rest-block"><div class="habit-top"><span class="habit-index">02</span><div><p class="habit-label">FITNESS · RECOVERY</p><h2>No lift scheduled</h2><p>Rest days — no lifts Fri–Sun.</p></div></div><p class="habit-note">' + restNote + "</p></section>";
        }

        PRACTICE_AREAS.forEach(function (area, areaIndex) {
          html += renderPracticeSection(area, areaIndex + 3, todayLog);
        });

        // Yoga (Tuesdays)
        if (weekdayNumber === 2) {
          html += '<section class="habit-block yoga' + (todayLog.yogaDone ? " complete" : "") + '">';
          html += '<div class="habit-top"><span class="habit-index">06</span><div><p class="habit-label">RECOVERY · 6–6:50 PM</p><h2>Vinyasa Yoga</h2><p>Apartment studio</p></div>' + (todayLog.yogaDone ? '<span class="completion-mark">' + icon("check") + "</span>" : "") + "</div>";
          html += '<div class="choices">' + choiceButton(todayLog.yogaDone, "Done", 'data-action="yoga-done"') + "</div>";
          html += "</section>";
        }

        // Reflection
        var syncLabel = todayLog.cloudSyncStatus === "synced" ? "Saved · cloud synced" : todayLog.cloudSyncStatus === "error" ? "Saved here · cloud sync needs attention" : todayLog.cloudSyncStatus === "pending" ? "Saving · syncing…" : todayLog.syncStatus === "synced" ? "Saved · synced" : todayLog.syncStatus === "error" ? "Saved · Notion sync needs attention" : "Saved on this device";
        html += '<section class="reflection-block"><div class="reflection-head"><label for="reflection">Gratitude &amp; reflection <span>optional</span></label><button type="button" id="save-reflection">Save note</button></div>';
        html += '<textarea id="reflection" maxlength="2000" placeholder="One line is enough…"></textarea>';
        html += '<div class="reflection-footer"><span>' + escapeHtml(syncLabel) + "</span></div></section>";
        html += "</div>";

        appEl.innerHTML = html;

        var textarea = document.getElementById("reflection");
        textarea.value = todayLog.reflection;
        textarea.addEventListener("input", function () {
          var button = document.getElementById("save-reflection");
          button.disabled = textarea.value === store.log(today).reflection;
        });
        document.getElementById("save-reflection").disabled = true;
        document.getElementById("save-reflection").addEventListener("click", function () {
          var log = store.log(today);
          log.reflection = textarea.value.trim();
          persistAndSync(log);
        });

        document.getElementById("streak-cluster").addEventListener("click", function () {
          currentTab = "scorecard";
          window.scrollTo(0, 0);
          render();
        });

        bind(document.querySelector('[data-action="spiritual-done"]'), function () {
          saveCompletion("spiritual", todayLog.spiritualStatus === "done" ? "none" : "done");
        });
        bind(document.querySelector('[data-action="spiritual-minimum"]'), function () {
          saveCompletion("spiritual", todayLog.spiritualStatus === "minimum" ? "none" : "minimum");
        });

        if (session) {
          bind(document.getElementById("exercise-toggle"), function () {
            ui.exercisesOpen = !ui.exercisesOpen;
            render();
          });
          bind(document.querySelector('[data-action="workout-lift"]'), function () {
            saveCompletion("workout", todayLog.workoutStatus === "lift" ? "none" : "lift", session.name);
          });
          bind(document.querySelector('[data-action="workout-class-open"]'), function () {
            ui.classPicker = !ui.classPicker;
            render();
          });
          bind(document.querySelector('[data-action="workout-minimum"]'), function () {
            saveCompletion("workout", todayLog.workoutStatus === "minimum" ? "none" : "minimum", session.name);
          });
          Array.prototype.forEach.call(document.querySelectorAll("[data-class]"), function (button) {
            button.addEventListener("click", function () {
              ui.classPicker = false;
              saveCompletion("workout", "class", button.getAttribute("data-class"));
            });
          });
        }

        bind(document.querySelector('[data-action="yoga-done"]'), function () {
          saveCompletion("yoga", todayLog.yogaDone ? "none" : "done");
        });

        Array.prototype.forEach.call(document.querySelectorAll("[data-practice-toggle]"), function (button) {
          button.addEventListener("click", function () {
            var key = button.getAttribute("data-practice-toggle");
            var splitAt = key.indexOf(".");
            var areaKey = key.slice(0, splitAt);
            var practiceId = key.slice(splitAt + 1);
            var log = store.log(today);
            log.practices[areaKey][practiceId] = !log.practices[areaKey][practiceId];
            persistAndSync(log);
          });
        });
        Array.prototype.forEach.call(document.querySelectorAll("[data-practice-edit]"), function (button) {
          button.addEventListener("click", function () {
            ui.editPracticeKey = button.getAttribute("data-practice-edit");
            render();
            var input = document.querySelector('[data-practice-form="' + ui.editPracticeKey + '"] input');
            if (input) { input.focus(); input.select(); }
          });
        });
        Array.prototype.forEach.call(document.querySelectorAll("[data-practice-form]"), function (form) {
          form.addEventListener("submit", function (event) {
            event.preventDefault();
            savePracticeLabel(form.getAttribute("data-practice-form"), form.querySelector("input").value);
          });
        });
        Array.prototype.forEach.call(document.querySelectorAll("[data-practice-cancel]"), function (button) {
          button.addEventListener("click", function () { ui.editPracticeKey = ""; render(); });
        });
      }

      function bind(el, handler) { if (el) el.addEventListener("click", handler); }

      /* ---------------- Scorecard view ---------------- */

      function renderScorecard() {
        var logs = store.logs;
        var weekStart = ui.weekStart;
        var days = [];
        for (var i = 0; i < 7; i++) days.push(addDays(weekStart, i));
        var todayWeek = mondayOf(today);
        var spiritual = days.filter(function (date) { var l = logs[date]; return l && l.spiritualStatus !== "none"; }).length;
        var workouts = days.slice(0, 3).filter(function (date) { var l = logs[date]; return l && l.workoutStatus !== "none"; }).length;
        var spiritualStreak = countSpiritualStreak(logs, today);
        var workoutStreak = workoutWeekStreak(logs, today);
        var practiceStats = {};
        PRACTICE_AREAS.forEach(function (area) {
          practiceStats[area.key] = {
            complete: days.filter(function (date) { return practiceAreaDone(logs[date], area.key); }).length,
            streak: practiceStreak(logs, today, area.key)
          };
        });
        var fmt = function (value) { return new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" }).format(fromIso(value)); };
        var weekLabel = fmt(weekStart) + "–" + fmt(addDays(weekStart, 6));

        var hasSpiritualDoubleMiss = days.some(function (date, index) {
          var prev = days[index - 1];
          var l = logs[date], p = prev ? logs[prev] : null;
          return index > 0 && date <= today && (!l || l.spiritualStatus === "none") && (!p || p.spiritualStatus === "none");
        });
        var scheduled = days.slice(0, 3);
        var hasWorkoutDoubleMiss = scheduled.some(function (date, index) {
          var prev = scheduled[index - 1];
          var l = logs[date], p = prev ? logs[prev] : null;
          return index > 0 && date <= today && (!l || l.workoutStatus === "none") && (!p || p.workoutStatus === "none");
        });

        function ring(value, total, label) {
          var percent = total ? Math.min(100, Math.round((value / total) * 100)) : 0;
          return '<div class="ring-wrap" aria-label="' + label + ": " + value + " of " + total + '"><div class="ring" style="--progress:' + (percent * 3.6) + 'deg"><div><strong>' + value + "</strong><span>/" + total + "</span></div></div><span>" + label + "</span></div>";
        }

        var html = "";
        html += '<div class="view scorecard-view">';
        html += '<header class="section-header"><p>WEEKLY REVIEW</p><h1>Scorecard</h1></header>';
        html += '<div class="week-picker"><button type="button" id="week-prev" aria-label="Previous week">' + icon("arrow") + '</button><div><strong>' + (weekStart === todayWeek ? "This week" : weekLabel) + "</strong><span>" + weekLabel + '</span></div><button type="button" id="week-next" aria-label="Next week"' + (weekStart >= todayWeek ? " disabled" : "") + ">" + icon("arrow") + "</button></div>";
        html += '<div class="rings-panel five">' + ring(workouts, 3, "Workouts") + ring(spiritual, 7, "Spiritual") + PRACTICE_AREAS.map(function (area) { return ring(practiceStats[area.key].complete, 7, area.title); }).join("") + "</div>";

        if (hasSpiritualDoubleMiss || hasWorkoutDoubleMiss) {
          var which = [hasSpiritualDoubleMiss ? "spiritual" : "", hasWorkoutDoubleMiss ? "workouts" : ""].filter(Boolean).join(" + ");
          html += '<div class="miss-alert"><span>!</span><div><strong>Two in a row missed</strong><p>' + which + " needs a reset.</p></div></div>";
        }

        html += '<section class="week-strip" aria-label="Daily completion status">';
        days.forEach(function (date, index) {
          var log = logs[date] || blankLog(date);
          var future = date > today;
          var workoutDay = index < 3;
          var spiritualClass = log.spiritualStatus !== "none" ? "done" : future ? "future" : "miss";
          var workoutClass = workoutDay ? (log.workoutStatus !== "none" ? "done" : future ? "future" : "miss") : "off";
          html += '<div class="day-column' + (date === today ? " is-today" : "") + '"><span>' + WEEKDAY_SHORT[fromIso(date).getDay()] + "</span><b>" + fromIso(date).getDate() + '</b><i class="status-dot spiritual ' + spiritualClass + '" title="Spiritual"></i><i class="status-dot workout ' + workoutClass + '" title="Workout"></i></div>';
        });
        html += "</section>";
        html += '<div class="legend"><span><i class="status-dot spiritual done"></i>Spiritual</span><span><i class="status-dot workout done"></i>Workout</span></div>';
        html += '<section class="streak-ledger">';
        html += '<div><span>Daily spiritual</span><strong>' + spiritualStreak.current + " <small>current</small></strong><p>Best: " + spiritualStreak.best + " days</p></div>";
        html += '<div><span>3/3 workout weeks</span><strong>' + workoutStreak.current + " <small>current</small></strong><p>Best: " + workoutStreak.best + " weeks</p></div>";
        PRACTICE_AREAS.forEach(function (area) {
          var streak = practiceStats[area.key].streak;
          html += '<div><span>' + escapeHtml(area.title) + '</span><strong>' + streak.current + ' <small>current</small></strong><p>Best: ' + streak.best + ' days</p></div>';
        });
        html += "</section>";
        html += '<p class="score-note">A lift, backup class, or minimum fills a workout slot. Minimums stay visible so the score stays honest.</p>';
        html += "</div>";

        appEl.innerHTML = html;

        bind(document.getElementById("week-prev"), function () { ui.weekStart = addDays(weekStart, -7); render(); });
        bind(document.getElementById("week-next"), function () { ui.weekStart = addDays(weekStart, 7); render(); });
      }

      /* ---------------- Areas view ---------------- */

      function renderAreas() {
        var html = "";
        html += '<div class="view areas-view">';
        html += '<header class="section-header"><p>THE WHOLE SYSTEM</p><h1>Life areas</h1><span>Five active now. Six coming soon.</span></header>';
        html += '<div class="area-grid">';
        AREAS.forEach(function (area, index) {
          html += '<button type="button" class="area-tile ' + area.status + '" data-area="' + area.key + '">';
          html += '<span class="area-number">' + String(index + 1).padStart(2, "0") + "</span>";
          html += '<span class="area-status ' + area.status + '"><i></i>' + (area.status === "active" ? "Active" : "Coming soon") + "</span>";
          html += "<strong>" + escapeHtml(area.title) + "</strong><small>" + escapeHtml(area.role) + "</small>";
          html += '<span class="area-arrow">' + icon("arrow", 17) + "</span>";
          html += "</button>";
        });
        html += "</div></div>";

        var selected = null;
        AREAS.forEach(function (area) { if (area.key === ui.selectedArea) selected = area; });
        if (selected) {
          html += '<div class="sheet-backdrop" id="sheet-backdrop"><section class="area-sheet" id="area-sheet">';
          html += '<button type="button" class="sheet-close" id="sheet-close" aria-label="Close area details">' + icon("close") + "</button>";
          html += "<p>" + (selected.status === "active" ? "ACTIVE AREA" : "FUTURE AREA") + "</p><h2>" + escapeHtml(selected.title) + '</h2><span class="role-line">Your ' + escapeHtml(selected.role) + "</span>";
          if (selected.status === "active") {
            html += "<ul>" + selected.targets.map(function (target) { return "<li>" + icon("check", 18) + escapeHtml(target) + "</li>"; }).join("") + "</ul>";
          } else {
            html += '<div class="coming-copy"><strong>Coming in a future update.</strong><span>The system already has a place for this area; its daily actions and scorecard will be added when you activate it.</span></div>';
          }
          html += "</section></div>";
        }

        appEl.innerHTML = html;

        Array.prototype.forEach.call(document.querySelectorAll("[data-area]"), function (tile) {
          tile.addEventListener("click", function () {
            ui.selectedArea = tile.getAttribute("data-area");
            render();
          });
        });
        bind(document.getElementById("sheet-close"), function () { ui.selectedArea = null; render(); });
        var backdrop = document.getElementById("sheet-backdrop");
        if (backdrop) {
          backdrop.addEventListener("click", function (event) {
            if (event.target === backdrop) { ui.selectedArea = null; render(); }
          });
        }
      }

      /* ---------------- Settings view ---------------- */

      function renderSettings() {
        var settings = store.settings;
        var html = "";
        html += '<div class="view settings-view">';
        html += '<header class="section-header"><p>CONNECTIONS</p><h1>Settings</h1></header>';
        var profileName = authState.profile && authState.profile.display_name ? authState.profile.display_name : "Account";
        var profileEmail = authState.session && authState.session.user ? (authState.session.user.email || "") : "";
        html += '<section class="connection-panel account-panel"><div class="connection-head"><div><h2>Supabase account</h2><p>Cross-device history is on</p></div><span class="connection-dot on"></span></div>';
        html += '<div class="account-summary"><span class="account-avatar">' + escapeHtml(profileName.charAt(0).toUpperCase()) + '</span><div><strong>' + escapeHtml(profileName) + '</strong><span>' + escapeHtml(profileEmail) + '</span></div></div>';
        html += '<button type="button" class="text-action" id="sign-out">Sign out</button></section>';
        html += '<section class="connection-panel">';
        html += '<div class="connection-head"><div><h2>Notion Daily Log</h2><p>' + (settings.notionConnected ? "Connected · " + escapeHtml(settings.notionWorkspaceName || "Daily Log") : "Not connected") + '</p></div><span class="connection-dot' + (settings.notionConnected ? " on" : "") + '"></span></div>';

        if (!settings.notionConnected) {
          html += '<label for="notion-token">Integration token</label>';
          html += '<input id="notion-token" type="password" autocomplete="off" placeholder="secret_…" />';
          html += '<label for="database-id">Database ID</label>';
          html += '<input id="database-id" />';
          html += '<button type="button" class="primary-action" id="test-connect"' + (ui.testing ? " disabled" : "") + ">" + (ui.testing ? "Testing…" : "Test &amp; connect") + "</button>";
          if (ui.testMessage) {
            html += '<p class="form-message ' + (ui.testOk ? "success" : "error") + '">' + escapeHtml(ui.testMessage) + "</p>";
          }
        } else {
          html += '<div class="connected-summary">' + icon("sync") + "<span>Check-offs and reflections sync after every save.</span></div>";
          html += '<button type="button" class="text-action" id="disconnect"' + (ui.disconnecting ? " disabled" : "") + ">" + (ui.disconnecting ? "Disconnecting…" : "Disconnect Notion") + "</button>";
        }
        html += "</section>";

        html += '<section class="setup-guide"><h2>Connect in three steps</h2><ol>';
        html += "<li><b>1</b><span>Create an internal integration at <code>notion.so/my-integrations</code>.</span></li>";
        html += "<li><b>2</b><span>In Notion, share the Daily Log database with that integration.</span></li>";
        html += "<li><b>3</b><span>Paste the token above, then test the connection.</span></li>";
        html += "</ol><p>The token stays in this browser and is only ever sent to Notion. Tracking works here even before Notion is connected; the Daily Log is the long-term record.</p></section>";
        html += "</div>";

        appEl.innerHTML = html;

        bind(document.getElementById("sign-out"), function () {
          if (!supabaseClient) return;
          var button = document.getElementById("sign-out");
          button.disabled = true;
          button.textContent = "Signing out…";
          supabaseClient.auth.signOut().then(function (result) {
            if (result.error) throw result.error;
          }).catch(function (error) {
            button.disabled = false;
            button.textContent = "Sign out";
            authState.error = error && error.message ? error.message : "Could not sign out.";
          });
        });

        if (!settings.notionConnected) {
          document.getElementById("notion-token").value = settings.notionToken || "";
          document.getElementById("database-id").value = settings.notionDatabaseId || DEFAULT_DATABASE_ID;
          bind(document.getElementById("test-connect"), function () {
            var token = document.getElementById("notion-token").value.trim();
            var databaseId = document.getElementById("database-id").value.trim();
            if (token.length < 8) return;
            ui.testing = true;
            render();
            notionRequest(token, "https://api.notion.com/v1/databases/" + databaseId).then(function (data) {
              var properties = data && typeof data.properties === "object" && data.properties !== null ? data.properties : {};
              var required = ["Day", "Date", "Spiritual Practice", "Workout Done", "Planned Workout", "Workout Notes", "Minimum Only", "Gratitude & Reflection"];
              var missing = required.filter(function (name) { return !(name in properties); });
              ui.testing = false;
              if (missing.length) {
                ui.testOk = false;
                ui.testMessage = "Connected, but the Daily Log is missing: " + missing.join(", ") + ".";
                render();
                return;
              }
              var titleArray = Array.isArray(data.title) ? data.title : [];
              var firstTitle = titleArray[0];
              store.settings.notionToken = token;
              store.settings.notionDatabaseId = databaseId;
              store.settings.notionConnected = true;
              store.settings.notionWorkspaceName = firstTitle && typeof firstTitle.plain_text === "string" ? firstTitle.plain_text : "Daily Log";
              store.settings.notionLastTestedAt = new Date().toISOString();
              store.saveSettings();
              ui.testOk = true;
              ui.testMessage = "Notion is connected.";
              render();
              // Push today's entry up now that sync is live.
              persistAndSync(store.log(today));
            }).catch(function (error) {
              ui.testing = false;
              ui.testOk = false;
              ui.testMessage = (error instanceof Error ? error.message : "Could not connect to Notion.").slice(0, 180);
              render();
            });
          });
        } else {
          bind(document.getElementById("disconnect"), function () {
            ui.disconnecting = true;
            render();
            store.settings.notionConnected = false;
            store.settings.notionWorkspaceName = "";
            store.settings.notionToken = "";
            store.settings.notionLastTestedAt = new Date().toISOString();
            store.saveSettings();
            ui.disconnecting = false;
            render();
          });
        }
      }

      initializeSupabase();
    </script>
  </body>
</html>
